name: Package skills

on:
  push:
    branches: [main]

concurrency:
  group: package-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zip-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set release tag (date-based)
        id: tag
        run: echo "TAG=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Create zip package
        run: |
          zip -r arena360-agent-connectors.zip \
            .claude-plugin \
            .agents \
            .cursor-plugin \
            plugins \
            server.json \
            README.md \
            LICENSE \
            NOTICE

      - name: Delete existing release for today (if re-running)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.TAG }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" arena360-agent-connectors.zip \
            --title "ARENA360 agent connectors $TAG" \
            --notes "Packaging snapshot for $TAG from $SHA. Plugin version is in the manifests." \
            --target "$SHA" \
            --latest
